<!doctype html>
<html>
	<body style="margin:0">
		<iframe id="f" src="/" style="width:390px;height:844px;border:0"></iframe>
		<pre id="out">waiting</pre>
		<script>
			const f = document.getElementById('f');
			f.onload = () =>
				setTimeout(() => {
					const d = f.contentDocument;
					const w = d.documentElement.clientWidth;
					const hits = [];
					for (const el of d.body.querySelectorAll('*')) {
						const r = el.getBoundingClientRect();
						if (r.right > w + 1 && r.width > 0) {
							hits.push(`${Math.round(r.right)} ${el.tagName.toLowerCase()} .${String(el.className.baseVal ?? el.className).slice(0, 90)}`);
						}
					}
					document.getElementById('out').textContent =
						`clientWidth=${w} scrollWidth=${d.documentElement.scrollWidth}\n` + hits.slice(0, 25).join('\n');
				}, 2500);
		</script>
	</body>
</html>
